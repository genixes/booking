<title>Admin Dashboard</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<style>
  :root {
    --navy:#15455F; --navy-d:#0E3140; --green:#1FB373; --green-d:#178C5A;
    --bg:#EEF3F3; --card:#FFFFFF; --line:#E2E9EA; --text:#1B2E36; --muted:#6B828C;
    --open-bg:#E7F6EE; --open-tx:#178C5A;
    --pend-bg:#FCF1D8; --pend-tx:#B07D0C;
    --book-bg:#FBE7E5; --book-tx:#C2453B;
    --ok-bg:#E7F6EE; --ok-tx:#178C5A; --cancel:#C2453B;
    --radius:16px; --shadow:0 1px 2px rgba(21,69,95,.05),0 10px 30px rgba(21,69,95,.07);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { max-width:100%; overflow-x:hidden; }
  body { font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); line-height:1.5; -webkit-font-smoothing:antialiased; }
  img { max-width:100%; }

  /* Login */
  .login-wrap { min-height:100vh; display:grid; place-items:center; padding:16px; }
  .login-card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:30px; width:100%; max-width:380px; }
  .login-card .brand { display:flex; align-items:center; gap:12px; margin-bottom:6px; }
  .login-card .brand img { width:44px; height:44px; border-radius:10px; object-fit:cover; }
  .login-card h1 { font-size:20px; color:var(--navy); font-weight:800; }
  .login-card .eyebrow { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:700; }
  .login-card p.sub { color:var(--muted); font-size:14px; margin:10px 0 20px; }
  label.fl { display:block; font-weight:600; font-size:14px; margin:14px 0 6px; }
  input { width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; font:inherit; }
  input:focus { outline:2px solid var(--green); border-color:var(--green); }
  .btn { width:100%; background:var(--green); color:#fff; border:none; padding:14px; border-radius:12px; font:inherit; font-weight:700; font-size:16px; cursor:pointer; transition:background .15s; }
  .btn:hover { background:var(--green-d); }
  .btn:disabled { background:#B7C6C9; cursor:not-allowed; }
  .login-err { color:var(--cancel); font-size:13px; font-weight:600; margin-top:12px; min-height:18px; }

  /* Topbar */
  .topbar { background:var(--navy); color:#fff; padding:14px 18px; display:flex; align-items:center; gap:12px; }
  .topbar img { width:38px; height:38px; border-radius:9px; object-fit:cover; }
  .topbar h1 { font-size:16px; font-weight:800; line-height:1.15; }
  .topbar .eyebrow { font-size:10px; letter-spacing:.14em; text-transform:uppercase; opacity:.7; font-weight:700; }
  .topbar .spacer { margin-left:auto; }
  .bell { position:relative; background:rgba(255,255,255,.14); border:none; color:#fff; width:42px; height:42px; border-radius:10px; cursor:pointer; font-size:18px; display:grid; place-items:center; }
  .bell:hover { background:rgba(255,255,255,.24); }
  .bell .dot { position:absolute; top:-5px; right:-5px; background:var(--cancel); color:#fff; font-size:11px; font-weight:800; min-width:20px; height:20px; border-radius:999px; display:grid; place-items:center; padding:0 5px; border:2px solid var(--navy); }
  .signout { background:rgba(255,255,255,.14); color:#fff; border:none; padding:10px 14px; border-radius:10px; font:inherit; font-weight:600; cursor:pointer; }
  .signout:hover { background:rgba(255,255,255,.24); }

  .container { max-width:920px; margin:0 auto; padding:18px 16px 60px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; }
  .card h3 { font-size:16px; font-weight:800; color:var(--navy); margin-bottom:14px; }

  /* Calendar */
  .cal-nav { display:flex; gap:8px; align-items:center; margin-bottom:12px; }
  .cal-nav .today { flex:1; }
  .btn-ghost { border:1px solid var(--line); background:#fff; border-radius:10px; padding:9px 12px; font:inherit; font-weight:600; cursor:pointer; color:var(--navy); }
  .btn-ghost:hover { border-color:var(--green); }
  .cal-month { text-align:center; font-weight:700; color:var(--navy); margin-bottom:8px; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .cal-grid .dow { text-align:center; font-size:11px; font-weight:700; color:var(--muted); padding:6px 0; }
  .cal-day { position:relative; aspect-ratio:1; display:grid; place-items:center; border-radius:9px; font-size:13px; font-weight:600; cursor:pointer; color:var(--text); }
  .cal-day:hover:not(.active) { background:var(--open-bg); }
  .cal-day.active { background:var(--navy); color:#fff; }
  .cal-day.muted { color:#C2CDD1; }

  /* Stats */
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:16px 0; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow); }
  .stat .n { font-size:24px; font-weight:800; color:var(--navy); }
  .stat .l { font-size:12px; color:var(--muted); font-weight:600; }
  @media (max-width:560px){ .stats{ grid-template-columns:1fr 1fr; } .stat:last-child{ grid-column:1/-1; } }

  /* View toggle */
  .view-head { display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .view-head h3 { margin:0; }
  .toggle { margin-left:auto; display:inline-flex; background:#EAF0F0; border-radius:10px; padding:3px; }
  .toggle button { border:none; background:transparent; padding:8px 16px; border-radius:8px; font:inherit; font-weight:700; font-size:13px; cursor:pointer; color:var(--muted); }
  .toggle button.on { background:#fff; color:var(--navy); box-shadow:0 1px 3px rgba(0,0,0,.08); }

  /* List cards */
  .booking { border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; }
  .booking .row1 { display:flex; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
  .booking .court { font-weight:800; color:var(--navy); font-size:16px; }
  .badge { font-size:11px; font-weight:800; padding:4px 10px; border-radius:999px; text-transform:uppercase; letter-spacing:.04em; }
  .badge.pending { background:var(--pend-bg); color:var(--pend-tx); }
  .badge.confirmed { background:var(--ok-bg); color:var(--ok-tx); }
  .badge.cancelled { background:#EEF1F2; color:#8895A0; }
  .booking .amt { margin-left:auto; font-weight:800; color:var(--navy); }
  .booking .times { font-size:14px; margin-bottom:6px; }
  .booking .who { font-size:13px; color:var(--muted); }
  .booking .who strong { color:var(--text); }
  .booking .actions { display:flex; gap:10px; margin-top:14px; }
  .act { flex:1; border:none; padding:11px; border-radius:10px; font:inherit; font-weight:700; cursor:pointer; }
  .act-confirm { background:var(--green); color:#fff; }
  .act-confirm:hover { background:var(--green-d); }
  .act-cancel { background:#fff; color:var(--cancel); border:1px solid #F0C7C2; }
  .act-cancel:hover { background:#FBE7E5; }

  /* Grid view */
  .table-scroll { overflow-x:auto; }
  table.sched { width:max-content; min-width:100%; border-collapse:separate; border-spacing:0; }
  table.sched thead th { font-size:13px; font-weight:700; color:var(--navy); padding:10px 8px; text-align:center; border-bottom:1px solid var(--line); white-space:nowrap; position:sticky; top:0; background:var(--card); z-index:2; }
  table.sched thead th:first-child { left:0; z-index:3; text-align:left; }
  table.sched thead th:not(:first-child) { min-width:104px; }
  table.sched td.time-cell { font-size:13px; font-weight:700; padding:0 10px; white-space:nowrap; border-bottom:1px solid var(--line); position:sticky; left:0; background:var(--card); z-index:1; width:80px; }
  table.sched td.cell { border-bottom:1px solid var(--line); padding:6px; min-width:104px; }
  .scell { border-radius:9px; padding:12px 4px; text-align:center; font-size:13px; font-weight:700; white-space:nowrap; }
  .scell-open { background:var(--open-bg); color:var(--open-tx); }
  .scell-pending { background:var(--pend-bg); color:var(--pend-tx); cursor:pointer; }
  .scell-booked { background:var(--book-bg); color:var(--book-tx); cursor:pointer; }

  .empty { text-align:center; padding:40px 16px; color:var(--muted); }
  .loading { text-align:center; padding:50px 16px; color:var(--muted); }

  /* Notifications panel */
  .backdrop { position:fixed; inset:0; background:rgba(14,49,64,.35); display:none; z-index:45; }
  .backdrop.show { display:block; }
  .notif { position:fixed; top:0; right:0; height:100%; width:380px; max-width:90vw; background:#fff; box-shadow:-8px 0 30px rgba(0,0,0,.15); z-index:46; transform:translateX(100%); transition:transform .22s ease; display:flex; flex-direction:column; }
  .notif.show { transform:translateX(0); }
  .notif-head { padding:18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  .notif-head h3 { font-size:17px; color:var(--navy); font-weight:800; }
  .notif-head .x { margin-left:auto; background:none; border:none; font-size:22px; cursor:pointer; color:var(--muted); line-height:1; }
  .notif-body { overflow-y:auto; padding:14px; flex:1; }
  .nitem { border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
  .nitem .nt { font-size:13px; font-weight:700; color:var(--navy); }
  .nitem .nd { font-size:12px; color:var(--muted); margin:2px 0 8px; }
  .nitem .nacts { display:flex; gap:8px; }
  .nitem .nacts button { flex:1; border:none; padding:8px; border-radius:8px; font:inherit; font-weight:700; font-size:12px; cursor:pointer; }

  /* Modal */
  .overlay { position:fixed; inset:0; background:rgba(14,49,64,.55); display:none; place-items:center; padding:16px; z-index:50; }
  .overlay.show { display:grid; }
  .modal { background:#fff; border-radius:var(--radius); padding:24px; width:100%; max-width:420px; box-shadow:var(--shadow); }
  .modal h3 { font-size:18px; color:var(--navy); margin-bottom:4px; }
  .modal .mrow { font-size:14px; margin:8px 0; }
  .modal .mrow span { color:var(--muted); }
  .modal-actions { display:flex; gap:10px; margin-top:18px; }
  .modal-actions .btn-ghost { flex:1; padding:13px; }
  .modal-actions .act { flex:1; }

  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--navy-d); color:#fff; padding:14px 20px; border-radius:12px; font-weight:600; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .2s; z-index:60; }
  .toast.show { opacity:1; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="login-wrap" style="display:none;">
  <div class="login-card">
    <div class="brand"><img id="loginLogo" alt="" style="display:none;" /><div><div class="eyebrow">Admin access</div><h1 id="loginBiz">Dashboard</h1></div></div>
    <p class="sub">Sign in to manage your court bookings.</p>
    <label class="fl" for="email">Email</label>
    <input type="email" id="email" placeholder="manager@email.com" autocomplete="username" />
    <label class="fl" for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
    <div class="login-err" id="loginErr"></div>
    <button class="btn" id="signinBtn" style="margin-top:6px;">Sign in</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashView" style="display:none;">
  <div class="topbar">
    <img id="topLogo" alt="" style="display:none;" />
    <div><div class="eyebrow">Admin Dashboard</div><h1 id="topBiz">Dashboard</h1></div>
    <div class="spacer"></div>
    <button class="bell" id="bellBtn">🔔<span class="dot" id="bellDot" style="display:none;">0</span></button>
    <button class="signout" id="signoutBtn">Sign out</button>
  </div>

  <div class="container">
    <div class="card">
      <h3>Select a date</h3>
      <div class="cal-nav">
        <button class="btn-ghost" id="prevMonth">‹</button>
        <button class="btn-ghost today" id="todayBtn">Today</button>
        <button class="btn-ghost" id="nextMonth">›</button>
      </div>
      <div class="cal-month" id="calMonth"></div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <div class="stats">
      <div class="stat"><div class="n" id="stPending">0</div><div class="l">Pending</div></div>
      <div class="stat"><div class="n" id="stConfirmed">0</div><div class="l">Confirmed</div></div>
      <div class="stat"><div class="n" id="stRevenue">₱0</div><div class="l">Day total</div></div>
    </div>

    <div class="card">
      <div class="view-head">
        <h3 id="dayTitle">Bookings</h3>
        <div class="toggle">
          <button id="tabList" class="on">List</button>
          <button id="tabGrid">Grid</button>
        </div>
      </div>
      <div id="listView"></div>
      <div id="gridView" style="display:none;">
        <div class="table-scroll"><table class="sched"><thead><tr id="schedHead"></tr></thead><tbody id="schedBody"></tbody></table></div>
      </div>
    </div>
  </div>
</div>

<!-- Notifications -->
<div class="backdrop" id="backdrop"></div>
<div class="notif" id="notif">
  <div class="notif-head"><h3>Pending bookings</h3><button class="x" id="notifClose">×</button></div>
  <div class="notif-body" id="notifBody"></div>
</div>

<!-- Detail modal -->
<div class="overlay" id="detailOverlay">
  <div class="modal" id="detailModal"></div>
</div>

<div id="boot" class="loading">Loading…</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Layaw System — Admin Dashboard (rebuild)
   Calendar + stats, List/Grid views, notifications (pending
   across all dates), real-time. Email login for now.
   ============================================================ */
let db, auth, SETTINGS=null, COURTS=[];
let dayUnsub=null, pendingUnsub=null;
let viewYear, viewMonth, selectedDate=null, currentView="list";
let DAY=[], PENDING=[];

try { firebase.initializeApp(firebaseConfig); db=firebase.firestore(); auth=firebase.auth(); }
catch(e){ document.getElementById("boot").textContent="Config error. Check the Firebase config at the top of this file."; }

const $=(id)=>document.getElementById(id);
function pad2(n){ return String(n).padStart(2,"0"); }
function dstr(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function today(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function parseDstr(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function hm2min(s){ const [h,m]=String(s).split(":").map(Number); return (h||0)*60+(m||0); }
function hourLabel(mins){ let h=Math.floor(mins/60),m=mins%60; const ap=h>=12&&h<24?"PM":"AM"; let h12=h%12; if(h12===0)h12=12; return m===0?(h12+ap):(h12+":"+pad2(m)+ap); }
function slotsLabel(slots){ const step=Number(SETTINGS&&SETTINGS.slotMinutes||60); return (slots||[]).map(s=>{const m=hm2min(s); return hourLabel(m)+"-"+hourLabel(m+step);}).join(", "); }
function peso(n){ return "₱"+Number(n||0).toLocaleString("en-PH"); }
function niceDate(s){ return parseDstr(s).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}); }
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2600); }
function darken(hex,f){ hex=String(hex).replace("#",""); if(hex.length===3)hex=hex.split("").map(c=>c+c).join(""); const n=parseInt(hex,16); let r=Math.round(((n>>16)&255)*f),g=Math.round(((n>>8)&255)*f),b=Math.round((n&255)*f); return "#"+[r,g,b].map(x=>("0"+x.toString(16)).slice(-2)).join(""); }

async function loadBase(){
  try{
    const cfg=await db.collection("settings").doc("config").get();
    if(cfg.exists){
      SETTINGS=cfg.data();
      const root=document.documentElement.style;
      if(SETTINGS.colorPrimary){ root.setProperty("--navy",SETTINGS.colorPrimary); root.setProperty("--navy-d",SETTINGS.colorPrimaryDark||darken(SETTINGS.colorPrimary,0.68)); }
      if(SETTINGS.colorAccent){ root.setProperty("--green",SETTINGS.colorAccent); root.setProperty("--green-d",SETTINGS.colorAccentDark||darken(SETTINGS.colorAccent,0.82)); }
      const name=SETTINGS.businessName||"Dashboard";
      $("loginBiz").textContent=name; $("topBiz").textContent=name; document.title=name+" — Admin";
      if(SETTINGS.logoUrl){ [$("loginLogo"),$("topLogo")].forEach(im=>{ im.src=SETTINGS.logoUrl; im.style.display="block"; }); }
    }
    const cs=await db.collection("courts").get();
    COURTS=[]; cs.forEach(d=>{ const c=d.data(); if(c.active!==false) COURTS.push({id:d.id,name:c.name||"Court"}); });
    COURTS.sort((a,b)=>a.name.localeCompare(b.name));
  }catch(e){ console.warn(e); }
}

/* ---------- Auth ---------- */
auth && auth.onAuthStateChanged(user=>{
  $("boot").style.display="none";
  if(user){ $("loginView").style.display="none"; $("dashView").style.display="block"; startDashboard(); }
  else { $("dashView").style.display="none"; $("loginView").style.display="grid"; if(dayUnsub){dayUnsub();} if(pendingUnsub){pendingUnsub();} }
});
$("signinBtn").onclick=async ()=>{
  const email=$("email").value.trim(), pw=$("password").value; $("loginErr").textContent="";
  if(!email||!pw){ $("loginErr").textContent="Please enter your email and password."; return; }
  const btn=$("signinBtn"); btn.disabled=true; btn.textContent="Signing in…";
  try{ await auth.signInWithEmailAndPassword(email,pw); }
  catch(e){ const map={"auth/invalid-email":"That email looks invalid.","auth/user-not-found":"No account found.","auth/wrong-password":"Incorrect password.","auth/invalid-credential":"Email or password is incorrect.","auth/too-many-requests":"Too many attempts. Try again later."}; $("loginErr").textContent=map[e.code]||"Could not sign in."; }
  finally { btn.disabled=false; btn.textContent="Sign in"; }
};
$("password").addEventListener("keydown",e=>{ if(e.key==="Enter") $("signinBtn").click(); });
$("signoutBtn").onclick=()=>auth.signOut();

/* ---------- Dashboard ---------- */
async function startDashboard(){
  if(!SETTINGS) await loadBase();
  const t=today(); viewYear=t.getFullYear(); viewMonth=t.getMonth(); selectedDate=dstr(t);
  renderCalendar(); renderSchedHead();
  watchDay(); watchPending();
}

/* Calendar (any date, no advance limit for admin) */
function renderCalendar(){
  const mn=["January","February","March","April","May","June","July","August","September","October","November","December"];
  $("calMonth").textContent=mn[viewMonth]+" "+viewYear;
  const grid=$("calGrid"); grid.innerHTML="";
  ["SUN","MON","TUE","WED","THU","FRI","SAT"].forEach(d=>{ const e=document.createElement("div"); e.className="dow"; e.textContent=d; grid.appendChild(e); });
  const startDow=new Date(viewYear,viewMonth,1).getDay(), daysIn=new Date(viewYear,viewMonth+1,0).getDate();
  for(let i=0;i<startDow;i++) grid.appendChild(document.createElement("div"));
  for(let day=1;day<=daysIn;day++){
    const ds=dstr(new Date(viewYear,viewMonth,day));
    const cell=document.createElement("div"); cell.className="cal-day"; cell.textContent=day;
    if(ds===selectedDate) cell.classList.add("active");
    cell.onclick=()=>{ selectedDate=ds; renderCalendar(); watchDay(); };
    grid.appendChild(cell);
  }
}
$("prevMonth").onclick=()=>{ viewMonth--; if(viewMonth<0){viewMonth=11;viewYear--;} renderCalendar(); };
$("nextMonth").onclick=()=>{ viewMonth++; if(viewMonth>11){viewMonth=0;viewYear++;} renderCalendar(); };
$("todayBtn").onclick=()=>{ const t=today(); viewYear=t.getFullYear(); viewMonth=t.getMonth(); selectedDate=dstr(t); renderCalendar(); watchDay(); };

/* Watch selected date */
function watchDay(){
  if(dayUnsub){ dayUnsub(); }
  $("dayTitle").textContent=niceDate(selectedDate);
  dayUnsub=db.collection("bookings").where("date","==",selectedDate).onSnapshot(snap=>{
    DAY=[]; snap.forEach(d=>DAY.push({id:d.id, ...d.data()}));
    DAY.sort((a,b)=>{ const ta=a.createdAt&&a.createdAt.seconds||0, tb=b.createdAt&&b.createdAt.seconds||0; return tb-ta; });
    let p=0,c=0,rev=0; DAY.forEach(b=>{ if(b.status==="pending")p++; if(b.status==="confirmed"){c++; rev+=Number(b.amount||0);} });
    $("stPending").textContent=p; $("stConfirmed").textContent=c; $("stRevenue").textContent=peso(rev);
    renderView();
  }, err=>{ console.error(err); $("listView").innerHTML='<div class="empty">Could not load bookings.</div>'; });
}

/* Watch all pending (for notifications) */
function watchPending(){
  if(pendingUnsub){ pendingUnsub(); }
  pendingUnsub=db.collection("bookings").where("status","==","pending").onSnapshot(snap=>{
    PENDING=[]; snap.forEach(d=>PENDING.push({id:d.id, ...d.data()}));
    PENDING.sort((a,b)=>{ if(a.date!==b.date) return a.date<b.date?-1:1; return (a.startTime||"").localeCompare(b.startTime||""); });
    const n=PENDING.length;
    const dot=$("bellDot"); if(n>0){ dot.style.display="grid"; dot.textContent=n>99?"99+":n; } else dot.style.display="none";
    renderNotif();
  }, err=>console.error(err));
}

/* View toggle */
$("tabList").onclick=()=>setView("list");
$("tabGrid").onclick=()=>setView("grid");
function setView(v){ currentView=v; $("tabList").classList.toggle("on",v==="list"); $("tabGrid").classList.toggle("on",v==="grid"); $("listView").style.display=v==="list"?"block":"none"; $("gridView").style.display=v==="grid"?"block":"none"; renderView(); }
function renderView(){ if(currentView==="list") renderList(); else renderGrid(); }

/* List view */
function renderList(){
  const wrap=$("listView"); wrap.innerHTML="";
  const shown=DAY.filter(b=>b.status!=="cancelled");
  if(!shown.length){ wrap.innerHTML='<div class="empty">No bookings for this date.</div>'; return; }
  shown.forEach(b=>{
    const st=b.status||"pending";
    let acts=""; if(st==="pending") acts='<button class="act act-confirm" data-id="'+b.id+'" data-act="confirm">Confirm</button><button class="act act-cancel" data-id="'+b.id+'" data-act="cancel">Cancel</button>'; else if(st==="confirmed") acts='<button class="act act-cancel" data-id="'+b.id+'" data-act="cancel">Cancel booking</button>';
    const card=document.createElement("div"); card.className="booking";
    card.innerHTML='<div class="row1"><span class="court">'+(b.court||"Court")+'</span><span class="badge '+st+'">'+st+'</span><span class="amt">'+peso(b.amount)+'</span></div><div class="times">'+slotsLabel(b.slots)+'</div><div class="who"><strong>'+(b.bookerName||"—")+'</strong> · '+(b.contact||"—")+(b.email?(' · '+b.email):'')+'</div>'+(acts?('<div class="actions">'+acts+'</div>'):'');
    wrap.appendChild(card);
  });
  wrap.querySelectorAll(".act").forEach(btn=>btn.onclick=()=>doAction(btn.getAttribute("data-id"),btn.getAttribute("data-act")));
}

/* Grid view */
function buildSlots(){ const open=Number(SETTINGS.openHour??8),close=Number(SETTINGS.closeHour??22),step=Number(SETTINGS.slotMinutes??60); const a=[]; for(let m=open*60;m+step<=close*60;m+=step) a.push({key:pad2(Math.floor(m/60))+":"+pad2(m%60),mins:m}); return a; }
function renderSchedHead(){ const tr=$("schedHead"); tr.innerHTML=""; const t=document.createElement("th"); t.textContent="Time"; tr.appendChild(t); COURTS.forEach(c=>{ const th=document.createElement("th"); th.textContent=c.name; tr.appendChild(th); }); }
function renderGrid(){
  if(!SETTINGS||!COURTS.length){ $("schedBody").innerHTML=""; return; }
  const map={}; // court|slot -> booking
  DAY.forEach(b=>{ if(b.status==="cancelled")return; (b.slots||[]).forEach(s=>map[b.court+"|"+s]=b); });
  const body=$("schedBody"); body.innerHTML="";
  buildSlots().forEach(slot=>{
    const tr=document.createElement("tr");
    const tc=document.createElement("td"); tc.className="time-cell"; tc.textContent=hourLabel(slot.mins)+"-"+hourLabel(slot.mins+Number(SETTINGS.slotMinutes??60)); tr.appendChild(tc);
    COURTS.forEach(c=>{
      const td=document.createElement("td"); td.className="cell";
      const b=map[c.name+"|"+slot.key];
      const cell=document.createElement("div");
      if(b && b.status==="confirmed"){ cell.className="scell scell-booked"; cell.textContent="Booked"; cell.onclick=()=>openDetail(b); }
      else if(b && b.status==="pending"){ cell.className="scell scell-pending"; cell.textContent="Pending"; cell.onclick=()=>openDetail(b); }
      else { cell.className="scell scell-open"; cell.textContent="Open"; }
      td.appendChild(cell); tr.appendChild(td);
    });
    body.appendChild(tr);
  });
}

/* Detail modal */
function openDetail(b){
  const st=b.status||"pending";
  let acts=""; if(st==="pending") acts='<button class="act act-confirm" data-id="'+b.id+'" data-act="confirm">Confirm</button><button class="act act-cancel" data-id="'+b.id+'" data-act="cancel">Cancel</button>'; else if(st==="confirmed") acts='<button class="act act-cancel" data-id="'+b.id+'" data-act="cancel">Cancel booking</button>';
  $("detailModal").innerHTML='<h3>'+(b.court||"Court")+' · <span class="badge '+st+'">'+st+'</span></h3>'+
    '<div class="mrow"><span>Date:</span> '+niceDate(b.date)+'</div>'+
    '<div class="mrow"><span>Time:</span> '+slotsLabel(b.slots)+'</div>'+
    '<div class="mrow"><span>Booker:</span> <strong>'+(b.bookerName||"—")+'</strong></div>'+
    '<div class="mrow"><span>Contact:</span> '+(b.contact||"—")+'</div>'+
    (b.email?'<div class="mrow"><span>Email:</span> '+b.email+'</div>':'')+
    '<div class="mrow"><span>Amount:</span> '+peso(b.amount)+'</div>'+
    '<div class="modal-actions"><button class="btn-ghost" id="detailClose">Close</button>'+acts+'</div>';
  $("detailOverlay").classList.add("show");
  $("detailClose").onclick=()=>$("detailOverlay").classList.remove("show");
  $("detailModal").querySelectorAll(".act").forEach(btn=>btn.onclick=async ()=>{ await doAction(btn.getAttribute("data-id"),btn.getAttribute("data-act")); $("detailOverlay").classList.remove("show"); });
}
$("detailOverlay").onclick=(e)=>{ if(e.target===$("detailOverlay")) $("detailOverlay").classList.remove("show"); };

/* Notifications */
function renderNotif(){
  const body=$("notifBody");
  if(!PENDING.length){ body.innerHTML='<div class="empty">No pending bookings. You\'re all caught up! 🎾</div>'; return; }
  body.innerHTML="";
  PENDING.forEach(b=>{
    const it=document.createElement("div"); it.className="nitem";
    it.innerHTML='<div class="nt">'+(b.court||"Court")+' · '+niceDate(b.date)+'</div><div class="nd">'+slotsLabel(b.slots)+' · '+(b.bookerName||"—")+' · '+(b.contact||"—")+'</div><div class="nacts"><button class="act-confirm" data-id="'+b.id+'" data-act="confirm">Confirm</button><button class="act-cancel" data-id="'+b.id+'" data-act="cancel">Cancel</button></div>';
    body.appendChild(it);
  });
  body.querySelectorAll("button").forEach(btn=>btn.onclick=()=>doAction(btn.getAttribute("data-id"),btn.getAttribute("data-act")));
}
$("bellBtn").onclick=()=>{ $("notif").classList.add("show"); $("backdrop").classList.add("show"); };
function closeNotif(){ $("notif").classList.remove("show"); $("backdrop").classList.remove("show"); }
$("notifClose").onclick=closeNotif; $("backdrop").onclick=closeNotif;

/* Confirm / cancel */
async function doAction(id,act){
  if(act==="cancel" && !confirm("Cancel this booking? The slots will reopen.")) return;
  try{ await db.collection("bookings").doc(id).update({ status: act==="confirm"?"confirmed":"cancelled" }); toast(act==="confirm"?"Booking confirmed.":"Booking cancelled."); }
  catch(e){ console.error(e); toast("Could not update. Please try again."); }
}

loadBase();
</script>
</body>
</html>
