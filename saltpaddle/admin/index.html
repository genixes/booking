<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Salt & Paddle Pickleball — Admin Dashboard</title>
<style>
  html,body{height:100%;margin:0;padding:0;background:#FBF2F5}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  #load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
        background:#FBF2F5;color:#4E4A52;font-family:system-ui,-apple-system,sans-serif;z-index:2}
  #load .dot{width:38px;height:38px;border:4px solid #d9cdd3;border-top-color:#4E4A52;border-radius:50%;
             animation:sp .8s linear infinite;margin-bottom:14px}
  #load b{font-size:15px;font-weight:700}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div id="load"><div class="dot"></div><b>Loading…</b></div>

  <!-- PASTE THE SALT & PADDLE /exec URL BELOW KEEP ?page=admin AT THE END -->
  <iframe id="app"
          src="https://script.google.com/macros/s/AKfycby7Ur7RGje3lQanIjbyn6P-9UB6aV0BIjUn7goHQZPxuPvFma0ULWwsednGFHJVNDkMYA/exec?page=admin"
          allow="clipboard-write; clipboard-read"
          onload="var l=document.getElementById('load'); if(l) l.style.display='none';"></iframe>
</body>
</html>
